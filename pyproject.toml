[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clairic"
dynamic = ["version"]
description = "Unofficial typed Python SDK for Cloudflare's Clairic extraction model, built on Pydantic."
readme = "README.md"
authors = [{ name = "Vianney Mixtur", email = "vianney@consio.ai" }]
license = { file = "LICENSE" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/VianneyMI/clairic"
Repository = "https://github.com/VianneyMI/clairic"
Issues = "https://github.com/VianneyMI/clairic/issues"
"Clairic model reference" = "https://developers.cloudflare.com/workers-ai/models/clairic/"

[dependency-groups]
dev = [
    "anyio>=4.4",
    "pyright>=1.1.400",
    "pytest>=8.3",
    "python-dotenv>=1.0",
    "ruff>=0.8",
]

[tool.hatch.version]
path = "src/clairic/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/clairic"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/NOTICE", "/README.md", "/pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "D"]
ignore = [
    "D100", "D104", "D105", "D107",  # module, package, magic and __init__ docstrings are optional
    "D203", "D213",                  # use D211 and D212 (Google style)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"scripts/**" = ["D"]
"examples/**" = ["D"]

[tool.pyright]
include = ["src", "tests", "scripts", "examples"]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
markers = ["live: calls the real Cloudflare API (needs CLOUDFLARE_ACCOUNT_ID and CLOUDFLARE_API_TOKEN)"]
addopts = "-m 'not live' --doctest-modules"
